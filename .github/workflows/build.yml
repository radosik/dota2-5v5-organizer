name: Build Windows app

# Builds the Windows .exe installer. Tauri can't reliably cross-compile to
# Windows from macOS/Linux, so this runs on a Windows runner.
#
# - Push a tag like `v0.1.0`  -> builds + attaches the installer to a GitHub Release.
# - Run manually (workflow_dispatch) -> builds + uploads the installer as a
#   downloadable workflow artifact.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app (.exe + installers)
        run: npm run tauri build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dota5v5-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/dota5v5.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Dota 5v5 Organizer ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
